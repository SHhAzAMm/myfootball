<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 Boxes — Открывай боксы</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.5;
        }
        .container { max-width: 1200px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 24px; }
        .header h1 {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #ffd700, #ff6b6b, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .header p { color: #94a3b8; font-size: 15px; }

        .category-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .cat-tab {
            background: rgba(255,255,255,0.06);
            border: 2px solid rgba(255,255,255,0.1);
            color: #cbd5e1;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .cat-tab:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .cat-tab.active {
            background: linear-gradient(135deg, #ffd700, #ff9500);
            color: #1a1a2e;
            border-color: transparent;
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.35);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .stat {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 22px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-value { font-size: 24px; font-weight: 900; color: #ffd700; }
        .stat-label { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }

        .open-zone {
            text-align: center;
            margin-bottom: 30px;
            padding: 40px 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            border: 2px dashed rgba(255,255,255,0.1);
        }
        .box-visual {
            font-size: 140px;
            line-height: 1;
            margin-bottom: 20px;
            display: inline-block;
            transition: transform 0.3s;
            filter: drop-shadow(0 0 40px rgba(255, 215, 0, 0.5));
            user-select: none;
        }
        .box-visual.shaking { animation: shake 0.5s infinite; }
        @keyframes shake {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-10deg) scale(1.05); }
            75% { transform: rotate(10deg) scale(1.05); }
        }
        .open-btn {
            background: linear-gradient(135deg, #ffd700, #ff9500);
            color: #1a1a2e;
            border: none;
            padding: 16px 48px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 12px;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 8px 24px rgba(255, 215, 0, 0.3);
            transition: transform 0.15s, box-shadow 0.15s;
            font-family: inherit;
        }
        .open-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255, 215, 0, 0.5); }
        .open-btn:active:not(:disabled) { transform: translateY(0); }
        .open-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ═══ RESET PANEL ═══ */
        .reset-panel {
            background: rgba(255,255,255,0.04);
            border: 2px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 30px;
            text-align: center;
        }
        .reset-panel.ready {
            border-color: rgba(239, 68, 68, 0.6);
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.3);
            background: rgba(239, 68, 68, 0.06);
        }
        .reset-title {
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            color: #94a3b8;
        }
        .reset-panel.ready .reset-title { color: #f87171; }
        .reset-hint {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 14px;
            line-height: 1.5;
        }
        .reset-hint b { color: #fff; }
        .reset-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 900;
            border-radius: 10px;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
            transition: transform 0.15s, box-shadow 0.15s;
            font-family: inherit;
            opacity: 0.4;
            cursor: not-allowed;
        }
        .reset-panel.ready .reset-btn {
            opacity: 1;
            cursor: pointer;
        }
        .reset-panel.ready .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.7);
        }
        .reset-progress {
            display: flex;
            justify-content: center;
            gap: 22px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            font-size: 13px;
        }
        .reset-progress-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #cbd5e1;
        }
        .reset-progress-item .check { font-size: 15px; }
        .reset-progress-item .ok { color: #4ade80; }
        .reset-progress-item .no { color: #94a3b8; }

        .reveal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .reveal-overlay.active { display: flex; }

        .reveal-card {
            position: relative;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 3px solid #475569;
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .reveal-card.common   { border-color: #94a3b8; box-shadow: 0 0 40px rgba(148,163,184,0.5); }
        .reveal-card.rare     { border-color: #3b82f6; box-shadow: 0 0 60px rgba(59,130,246,0.7); }
        .reveal-card.epic     { border-color: #a855f7; box-shadow: 0 0 70px rgba(168,85,247,0.8); }
        .reveal-card.legendary{ border-color: #f59e0b; box-shadow: 0 0 90px rgba(245,158,11,0.9); }
        .reveal-card.mythical { border-color: #ef4444; box-shadow: 0 0 120px rgba(239,68,68,1); }

        .reveal-x {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #cbd5e1;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, transform 0.15s;
            font-family: inherit;
            line-height: 1;
        }
        .reveal-x:hover { background: rgba(255,255,255,0.18); color: #fff; transform: scale(1.08); }

        .reveal-rarity {
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 12px;
            margin-top: 8px;
        }
        .reveal-card.common    .reveal-rarity { color: #94a3b8; }
        .reveal-card.rare      .reveal-rarity { color: #60a5fa; }
        .reveal-card.epic      .reveal-rarity { color: #c084fc; }
        .reveal-card.legendary .reveal-rarity { color: #fbbf24; }
        .reveal-card.mythical  .reveal-rarity { color: #f87171; }

        .reveal-emoji {
            margin: 12px 0 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
        }
        .reveal-stone {
            width: 220px;
            height: 220px;
            object-fit: contain;
            animation: floatStone 2s ease-in-out infinite;
            filter: drop-shadow(0 0 40px rgba(255,255,255,0.35));
        }
        .reveal-emoji-symbol {
            font-size: 110px;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.3));
        }
        @keyframes floatStone {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .reveal-name { font-size: 26px; font-weight: 900; margin-bottom: 8px; }
        .reveal-desc { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        .reveal-count-badge {
            display: inline-block;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: #cbd5e1;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .reveal-close {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px 32px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s;
            font-family: inherit;
        }
        .reveal-close:hover { background: rgba(255,255,255,0.2); }

        .collection-title {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .collection-title .count { font-size: 14px; color: #94a3b8; font-weight: 500; }
        .collection {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }
        .hero-card {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 16px 10px;
            text-align: center;
            transition: transform 0.15s, box-shadow 0.15s;
            position: relative;
        }
        .hero-card.unlocked { cursor: pointer; }
        .hero-card.unlocked:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .hero-card.locked { opacity: 0.55; }
        .hero-card.common    { border-color: #94a3b8; }
        .hero-card.rare      { border-color: #3b82f6; }
        .hero-card.epic      { border-color: #a855f7; }
        .hero-card.legendary { border-color: #f59e0b; }
        .hero-card.mythical  { border-color: #ef4444; }

        .hero-img {
            width: 75px;
            height: 75px;
            object-fit: contain;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 12px rgba(255,255,255,0.15));
        }
        .hero-emoji { font-size: 42px; margin-bottom: 8px; line-height: 1; }
        .hero-locked-icon {
            font-size: 42px;
            margin-bottom: 8px;
            line-height: 1;
            color: #64748b;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .hero-name { font-size: 13px; font-weight: 700; line-height: 1.2; margin-bottom: 4px; }
        .hero-count { font-size: 11px; color: #94a3b8; }
        .hero-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 10px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(0,0,0,0.3);
            text-transform: uppercase;
        }
        .hero-card.common    .hero-badge { color: #94a3b8; }
        .hero-card.rare      .hero-badge { color: #60a5fa; }
        .hero-card.epic      .hero-badge { color: #c084fc; }
        .hero-card.legendary .hero-badge { color: #fbbf24; }
        .hero-card.mythical  .hero-badge { color: #f87171; }

        @media (max-width: 600px) {
            body { padding: 14px; }
            .header h1 { font-size: 30px; }
            .cat-tab { padding: 10px 16px; font-size: 13px; }
            .box-visual { font-size: 100px; }
            .open-btn { padding: 14px 32px; font-size: 16px; }
            .reveal-card { padding: 32px 24px; }
            .reveal-x { width: 32px; height: 32px; font-size: 18px; top: 10px; right: 10px; }
            .reveal-stone { width: 180px; height: 180px; }
            .reveal-emoji-symbol { font-size: 80px; }
            .reveal-name { font-size: 22px; }
            .collection { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
            .hero-emoji, .hero-locked-icon { font-size: 34px; }
            .hero-img { width: 65px; height: 65px; }
            .reset-panel { padding: 16px; }
            .reset-btn { padding: 12px 28px; font-size: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎁 BOXES</h1>
            <p>Открывай боксы — собирай коллекцию</p>
        </div>

        <div class="category-tabs" id="categoryTabs"></div>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="statOpened">0</div>
                <div class="stat-label">Открыто</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="statCollected">0</div>
                <div class="stat-label">Собрано</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="statTotal">0</div>
                <div class="stat-label">Всего</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="statResets">0</div>
                <div class="stat-label">Ресетов</div>
            </div>
        </div>

        <div class="open-zone">
            <div class="box-visual" id="boxVisual">🎁</div>
            <br>
            <button class="open-btn" id="openBtn">ОТКРЫТЬ БОКС</button>
        </div>

        <!-- ═══ RESET PANEL ═══ -->
        <div class="reset-panel" id="resetPanel">
            <div class="reset-title" id="resetTitle">🔄 ПРЕСТИЖ</div>
            <div class="reset-progress" id="resetProgress"></div>
            <div class="reset-hint" id="resetHint"></div>
            <button class="reset-btn" id="resetBtn" disabled>🔄 RESET</button>
        </div>

        <div class="collection-title">
            Коллекция <span class="count" id="collectionCount"></span>
        </div>
        <div class="collection" id="collection"></div>
    </div>

    <div class="reveal-overlay" id="revealOverlay">
        <div class="reveal-card" id="revealCard">
            <button class="reveal-x" id="revealX" aria-label="Закрыть">×</button>
            <div class="reveal-rarity" id="revealRarity"></div>
            <div class="reveal-emoji" id="revealEmoji"></div>
            <div class="reveal-name" id="revealName"></div>
            <div class="reveal-desc" id="revealDesc"></div>
            <div class="reveal-count-badge" id="revealCountBadge" style="display:none;"></div>
            <button class="reveal-close" id="revealClose">Забрать</button>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════
        //  НАСТРОЙКИ
        // ═══════════════════════════════════════════════
        const RESET_BASE = 30;   // базовое число боксов для ресета
                                  // требование = RESET_BASE × (ресетов + 1)

        // ═══════════════════════════════════════════════
        //  🎌 АНИМЕ ПЕРСОНАЖИ
        // ═══════════════════════════════════════════════
        const ANIME_HEROES = [
            { id: 'gojo',     name: 'Годжо',       emoji: '🥷', rarity: 'legendary', desc: 'Сильнейший' },
            { id: 'naruto',   name: 'Наруто',      emoji: '🍥', rarity: 'epic',      desc: 'Хокаге' },
            { id: 'goku',     name: 'Гоку',        emoji: '🔥', rarity: 'mythical',  desc: 'Супер Саян' },
            { id: 'luffy',    name: 'Луффи',       emoji: '🏴‍☠️', rarity: 'legendary', desc: 'Король пиратов' },
            { id: 'zoro',     name: 'Зоро',        emoji: '⚔️', rarity: 'epic',      desc: 'Трёхмечевой' },
            { id: 'saitama',  name: 'Сайтама',     emoji: '👊', rarity: 'mythical',  desc: 'One Punch' },
            { id: 'levi',     name: 'Леви',        emoji: '🗡️', rarity: 'epic',      desc: 'Сильнейший солдат' },
            { id: 'sasuke',   name: 'Саске',       emoji: '🌩️', rarity: 'rare',      desc: 'Мститель' },
            { id: 'ichigo',   name: 'Ичиго',       emoji: '💀', rarity: 'rare',      desc: 'Синигами' },
            { id: 'killua',   name: 'Киллуа',      emoji: '⚡', rarity: 'epic',      desc: 'Охотник' },
            { id: 'tanjiro',  name: 'Танджиро',    emoji: '🌊', rarity: 'rare',      desc: 'Истребитель' },
            { id: 'deku',     name: 'Деку',        emoji: '💪', rarity: 'rare',      desc: 'One For All' },
            { id: 'bakugo',   name: 'Бакуго',      emoji: '💥', rarity: 'epic',      desc: 'Взрыв' },
            { id: 'eren',     name: 'Эрен',        emoji: '👁️', rarity: 'legendary', desc: 'Титан' },
            { id: 'mikasa',   name: 'Микаса',      emoji: '🧣', rarity: 'rare',      desc: 'Аккерман' },
            { id: 'vegeta',   name: 'Вегета',      emoji: '👑', rarity: 'epic',      desc: 'Принц Саянов' },
            { id: 'sanji',    name: 'Санджи',      emoji: '🚬', rarity: 'rare',      desc: 'Кок' },
            { id: 'hinata',   name: 'Хината',      emoji: '🏐', rarity: 'common',    desc: 'Волейбол' },
            { id: 'rimuru',   name: 'Римуру',      emoji: '🟦', rarity: 'legendary', desc: 'Слизь' },
            { id: 'ainz',     name: 'Айнз',        emoji: '💀', rarity: 'legendary', desc: 'Скелет' },
        ];

        // ═══════════════════════════════════════════════
        //  💎 ДРАГОЦЕННЫЕ КАМНИ
        // ═══════════════════════════════════════════════
        const GEM_HEROES = [
            { id: 'diamond',     name: 'Алмаз',         img: 'stones/diamond.png',     rarity: 'mythical',  desc: 'Твёрдость 10' },
            { id: 'alexandrite', name: 'Александрит',   img: 'stones/alexandrite.png', rarity: 'legendary', desc: 'Меняет цвет' },
            { id: 'ruby',        name: 'Рубин',         img: 'stones/ruby.png',        rarity: 'legendary', desc: 'Камень страсти' },
            { id: 'emerald',     name: 'Изумруд',       img: 'stones/emerald.png',     rarity: 'legendary', desc: 'Камень царей' },
            { id: 'sapphire',    name: 'Сапфир',        img: 'stones/sapphire.png',    rarity: 'legendary', desc: 'Небесный камень' },
            { id: 'amethyst',    name: 'Аметист',       img: 'stones/amethyst.png',    rarity: 'epic',      desc: 'Защита от сглаза' },
            { id: 'topaz',       name: 'Топаз',         img: 'stones/topaz.png',       rarity: 'epic',      desc: 'Солнечный камень' },
            { id: 'opal',        name: 'Опал',          img: 'stones/opal.png',        rarity: 'epic',      desc: 'Все цвета радуги' },
            { id: 'moonstone',   name: 'Лунный камень', img: 'stones/moonstone.png',   rarity: 'epic',      desc: 'Свет луны' },
            { id: 'aquamarine',  name: 'Аквамарин',     img: 'stones/aquamarine.png',  rarity: 'rare',      desc: 'Морская волна' },
            { id: 'garnet',      name: 'Гранат',        img: 'stones/garnet.png',      rarity: 'rare',      desc: 'Огонь и страсть' },
            { id: 'tourmaline',  name: 'Турмалин',      img: 'stones/tourmaline.png',  rarity: 'rare',      desc: 'Радужный камень' },
            { id: 'malachite',   name: 'Малахит',       img: 'stones/malachite.png',   rarity: 'rare',      desc: 'Зелёный узор' },
            { id: 'obsidian',    name: 'Обсидиан',      img: 'stones/obsidian.png',    rarity: 'rare',      desc: 'Вулканическое стекло' },
            { id: 'pearl',       name: 'Жемчуг',        img: 'stones/pearl.png',       rarity: 'rare',      desc: 'Слёзы моря' },
            { id: 'agate',       name: 'Агат',          img: 'stones/agate.png',       rarity: 'common',    desc: 'Полосатый камень' },
            { id: 'quartz',      name: 'Кварц',         img: 'stones/quartz.png',      rarity: 'common',    desc: 'Прозрачный кристалл' },
            { id: 'amber',       name: 'Янтарь',        img: 'stones/amber.png',       rarity: 'common',    desc: 'Солнечная смола' },
            { id: 'onyx',        name: 'Оникс',         img: 'stones/onyx.png',        rarity: 'common',    desc: 'Чёрный камень' },
            { id: 'pyrite',      name: 'Пирит',         img: 'stones/pyrite.png',      rarity: 'common',    desc: 'Золото дураков' },
        ];

        // ═══════════════════════════════════════════════
        //  🗂️ КАТЕГОРИИ
        //  unlockResets — сколько нужно ВСЕГО ресетов, чтобы категория открылась
        // ═══════════════════════════════════════════════
        const CATEGORIES = {
            anime: {
                name: 'Аниме персонажи',
                boxEmoji: '📦',
                heroes: ANIME_HEROES,
                unlockResets: 0,
            },
            gems: {
                name: 'Драгоценные камни',
                boxEmoji: '💎',
                heroes: GEM_HEROES,
                unlockResets: 0,
            },
            // ─────────────────────────────────────────
            //  ПРИМЕР: раскомментируй и добавь героев,
            //  когда захочешь добавить новую категорию
            // ─────────────────────────────────────────
            // animals: {
            //     name: 'Животные',
            //     boxEmoji: '🐾',
            //     heroes: ANIMAL_HEROES,   // твой массив
            //     unlockResets: 2,          // откроется после 2 ресетов
            // },
            // memes: {
            //     name: 'Мемы',
            //     boxEmoji: '😂',
            //     heroes: MEME_HEROES,
            //     unlockResets: 5,
            // },
        };

        const RARITY_CHANCES = {
            common: 55, rare: 25, epic: 13, legendary: 6, mythical: 1,
        };

        const RARITY_NAMES = {
            common: 'Обычный', rare: 'Редкий', epic: 'Эпический',
            legendary: 'Легендарный', mythical: 'Мифический',
        };

        const STORAGE_KEY = 'boxes_progress_v3';

        let currentCategory = 'anime';
        let state = {
            opened: {},
            owned: {},
            resets: {},   // ресеты по каждой категории
        };

        // ═══════════════════════════════════════════════
        //  СОСТОЯНИЕ
        // ═══════════════════════════════════════════════
        function initState() {
            for (const cat of Object.keys(CATEGORIES)) {
                if (state.opened[cat] === undefined) state.opened[cat] = 0;
                if (!state.owned[cat]) state.owned[cat] = {};
                if (state.resets[cat] === undefined) state.resets[cat] = 0;
            }
        }

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) state = JSON.parse(raw);
            } catch (e) {}
            initState();
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function getTotalResets() {
            return Object.values(state.resets).reduce((s, v) => s + v, 0);
        }

        function isCategoryUnlocked(catId) {
            return getTotalResets() >= CATEGORIES[catId].unlockResets;
        }

        function getHeroes() { return CATEGORIES[currentCategory].heroes; }

        // ═══════════════════════════════════════════════
        //  ЛОГИКА ОТКРЫТИЯ
        // ═══════════════════════════════════════════════
        function rollRarity() {
            const roll = Math.random() * 100;
            let acc = 0;
            for (const [rarity, chance] of Object.entries(RARITY_CHANCES)) {
                acc += chance;
                if (roll < acc) return rarity;
            }
            return 'common';
        }

        function pickHero(rarity) {
            const heroes = getHeroes();
            const pool = heroes.filter(h => h.rarity === rarity);
            if (pool.length === 0) return heroes[Math.floor(Math.random() * heroes.length)];
            return pool[Math.floor(Math.random() * pool.length)];
        }

        async function openBox() {
            const btn = document.getElementById('openBtn');
            const box = document.getElementById('boxVisual');
            btn.disabled = true;
            box.classList.add('shaking');

            await new Promise(r => setTimeout(r, 900));
            box.classList.remove('shaking');

            const rarity = rollRarity();
            const hero = pickHero(rarity);

            state.opened[currentCategory]++;
            state.owned[currentCategory][hero.id] = (state.owned[currentCategory][hero.id] || 0) + 1;
            saveState();

            showReveal(hero, false);
            renderStats();
            renderCollection();
            renderResetPanel();

            btn.disabled = false;
        }

        function showReveal(hero, isFromCollection) {
            const overlay = document.getElementById('revealOverlay');
            const card = document.getElementById('revealCard');
            const visualEl = document.getElementById('revealEmoji');
            const countBadge = document.getElementById('revealCountBadge');
            const closeBtn = document.getElementById('revealClose');

            card.className = 'reveal-card ' + hero.rarity;
            document.getElementById('revealRarity').textContent = RARITY_NAMES[hero.rarity];

            if (hero.img) {
                visualEl.innerHTML = `<img src="${hero.img}" alt="${hero.name}" class="reveal-stone">`;
            } else {
                visualEl.innerHTML = `<div class="reveal-emoji-symbol">${hero.emoji}</div>`;
            }

            document.getElementById('revealName').textContent = hero.name;
            document.getElementById('revealDesc').textContent = hero.desc || '';

            if (isFromCollection) {
                const count = (state.owned[currentCategory] || {})[hero.id] || 0;
                countBadge.textContent = `В коллекции: ×${count}`;
                countBadge.style.display = 'inline-block';
                closeBtn.style.display = 'none';
            } else {
                countBadge.style.display = 'none';
                closeBtn.style.display = 'inline-block';
            }

            overlay.classList.add('active');
        }

        function closeReveal() {
            document.getElementById('revealOverlay').classList.remove('active');
        }

        // ═══════════════════════════════════════════════
        //  RESET
        // ═══════════════════════════════════════════════
        function getResetStatus(catId) {
            const heroes = CATEGORIES[catId].heroes;
            const owned = state.owned[catId] || {};
            const allCollected = heroes.every(h => (owned[h.id] || 0) > 0);
            const requiredOpened = RESET_BASE * (state.resets[catId] + 1);
            const currentOpened = state.opened[catId] || 0;
            const enoughOpened = currentOpened >= requiredOpened;
            return {
                allCollected,
                enoughOpened,
                currentOpened,
                requiredOpened,
                canReset: allCollected && enoughOpened,
            };
        }

        function doReset() {
            const status = getResetStatus(currentCategory);
            if (!status.canReset) return;

            const catName = CATEGORIES[currentCategory].name;
            if (!confirm(`Ресет категории «${catName}»?\n\nВся коллекция обнулится, но ты получишь +1 к общему счётчику ресетов.`)) {
                return;
            }

            state.opened[currentCategory] = 0;
            state.owned[currentCategory] = {};
            state.resets[currentCategory]++;
            saveState();

            renderTabs();
            renderStats();
            renderCollection();
            renderResetPanel();
        }

        // ═══════════════════════════════════════════════
        //  РЕНДЕР
        // ═══════════════════════════════════════════════
        function renderTabs() {
            const container = document.getElementById('categoryTabs');
            const unlocked = Object.keys(CATEGORIES).filter(isCategoryUnlocked);

            if (!unlocked.includes(currentCategory)) {
                currentCategory = unlocked[0];
            }

            container.innerHTML = unlocked.map(id => {
                const cat = CATEGORIES[id];
                const active = id === currentCategory ? 'active' : '';
                const resets = state.resets[id] || 0;
                const resetBadge = resets > 0 ? ` (${resets}♻)` : '';
                return `<button class="cat-tab ${active}" data-cat="${id}">${cat.boxEmoji} ${cat.name}${resetBadge}</button>`;
            }).join('');

            container.querySelectorAll('.cat-tab').forEach(btn => {
                btn.addEventListener('click', () => switchCategory(btn.dataset.cat));
            });
        }

        function renderStats() {
            const heroes = getHeroes();
            const opened = state.opened[currentCategory] || 0;
            const collected = Object.keys(state.owned[currentCategory] || {}).length;
            const totalResets = getTotalResets();

            document.getElementById('statOpened').textContent = opened;
            document.getElementById('statCollected').textContent = collected;
            document.getElementById('statTotal').textContent = heroes.length;
            document.getElementById('statResets').textContent = totalResets;
        }

        function renderCollection() {
            const container = document.getElementById('collection');
            const heroes = getHeroes();
            const owned = state.owned[currentCategory] || {};

            const sorted = [...heroes].sort((a, b) => {
                const order = ['mythical', 'legendary', 'epic', 'rare', 'common'];
                return order.indexOf(a.rarity) - order.indexOf(b.rarity);
            });

            container.innerHTML = sorted.map(h => {
                const count = owned[h.id] || 0;
                const locked = count === 0;

                let visual;
                if (locked) {
                    visual = `<div class="hero-locked-icon">❓</div>`;
                } else if (h.img) {
                    visual = `<img src="${h.img}" alt="" class="hero-img">`;
                } else {
                    visual = `<div class="hero-emoji">${h.emoji}</div>`;
                }

                return `
                    <div class="hero-card ${h.rarity} ${locked ? 'locked' : 'unlocked'}"
                         data-id="${h.id}">
                        <div class="hero-badge">${RARITY_NAMES[h.rarity].slice(0, 3)}</div>
                        ${visual}
                        <div class="hero-name">${locked ? '???' : h.name}</div>
                        <div class="hero-count">${locked ? 'не найден' : `×${count}`}</div>
                    </div>
                `;
            }).join('');

            container.querySelectorAll('.hero-card.unlocked').forEach(card => {
                card.addEventListener('click', () => {
                    const id = card.dataset.id;
                    const hero = getHeroes().find(h => h.id === id);
                    if (hero) showReveal(hero, true);
                });
            });

            const collected = Object.keys(owned).length;
            document.getElementById('collectionCount').textContent = `${collected} / ${heroes.length}`;
        }

        function renderResetPanel() {
            const panel = document.getElementById('resetPanel');
            const progressEl = document.getElementById('resetProgress');
            const hintEl = document.getElementById('resetHint');
            const btn = document.getElementById('resetBtn');
            const titleEl = document.getElementById('resetTitle');

            const s = getResetStatus(currentCategory);
            const resets = state.resets[currentCategory] || 0;
            const totalResets = getTotalResets();

            // Заголовок
            titleEl.textContent = `🔄 ПРЕСТИЖ (ресетов в категории: ${resets})`;

            // Прогресс
            const checkCollected = s.allCollected ? '✅' : '⬜';
            const classCollected = s.allCollected ? 'ok' : 'no';
            const checkOpened = s.enoughOpened ? '✅' : '⬜';
            const classOpened = s.enoughOpened ? 'ok' : 'no';

            progressEl.innerHTML = `
                <div class="reset-progress-item">
                    <span class="check">${checkCollected}</span>
                    <span class="${classCollected}">Собрать всех: <b>${Object.keys(state.owned[currentCategory] || {}).length} / ${getHeroes().length}</b></span>
                </div>
                <div class="reset-progress-item">
                    <span class="check">${checkOpened}</span>
                    <span class="${classOpened}">Открыть боксов: <b>${s.currentOpened} / ${s.requiredOpened}</b></span>
                </div>
            `;

            // Подсказка про следующую категорию
            const nextCat = Object.entries(CATEGORIES)
                .filter(([id, c]) => c.unlockResets > totalResets)
                .sort((a, b) => a[1].unlockResets - b[1].unlockResets)[0];

            let hint = '';
            if (s.canReset) {
                hint = 'Готово! Нажми RESET, чтобы обнулить эту категорию и получить +1 ресет.';
            } else {
                const reasons = [];
                if (!s.allCollected) reasons.push('собери всех героев категории');
                if (!s.enoughOpened) reasons.push(`открой ещё ${s.requiredOpened - s.currentOpened} боксов`);
                hint = 'Требуется: ' + reasons.join(' и ') + '.';
            }

            if (nextCat) {
                const [id, c] = nextCat;
                const left = c.unlockResets - totalResets;
                hint += ` Следующая категория «${c.name}» откроется через ${left} ресет${left === 1 ? '' : 'ов'}.`;
            }

            hintEl.innerHTML = hint;

            // Активация кнопки
            if (s.canReset) {
                panel.classList.add('ready');
                btn.disabled = false;
            } else {
                panel.classList.remove('ready');
                btn.disabled = true;
            }
        }

        function renderBox() {
            document.getElementById('boxVisual').textContent = CATEGORIES[currentCategory].boxEmoji;
        }

        function switchCategory(cat) {
            if (cat === currentCategory) return;
            currentCategory = cat;

            renderTabs();
            renderBox();
            renderStats();
            renderCollection();
            renderResetPanel();
        }

        // ═══════════════════════════════════════════════
        //  ОБРАБОТЧИКИ
        // ═══════════════════════════════════════════════
        document.getElementById('openBtn').addEventListener('click', openBox);
        document.getElementById('resetBtn').addEventListener('click', doReset);
        document.getElementById('revealClose').addEventListener('click', closeReveal);
        document.getElementById('revealX').addEventListener('click', closeReveal);
        document.getElementById('revealOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'revealOverlay') closeReveal();
        });

        // ═══════════════════════════════════════════════
        //  СТАРТ
        // ═══════════════════════════════════════════════
        loadState();
        renderTabs();
        renderBox();
        renderStats();
        renderCollection();
        renderResetPanel();
    </script>
</body>
</html>
