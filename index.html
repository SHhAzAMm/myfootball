<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бундеслига — Матчи, таблица, бомбардиры</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            padding: 24px;
            line-height: 1.5;
        }
        .container { max-width: 1200px; margin: 0 auto; }

        /* ═══ ШАПКА ЛИГИ ═══ */
        .league-header {
            background: white;
            border-radius: 14px;
            padding: 22px 26px;
            margin-bottom: 28px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .league-top {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 18px;
        }
        .league-logo {
            width: 72px;
            height: 72px;
            flex-shrink: 0;
            object-fit: contain;
        }
        .league-title-block {
            flex: 1;
        }
        .league-title {
            font-size: 30px;
            font-weight: 800;
            color: #1a1a2e;
            margin: 0 0 4px 0;
            letter-spacing: -0.3px;
        }
        .followers {
            font-size: 13px;
            color: #6b7280;
            font-weight: 600;
        }
        .followers b { color: #1a1a2e; font-weight: 800; }
        .fav-btn {
            background: #4355eb;
            color: white;
            border: none;
            padding: 11px 22px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .fav-btn:hover { background: #3444c9; }
        .fav-btn .star { font-size: 15px; }

        .league-sub {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .country-flag {
            width: 28px;
            height: 20px;
            border-radius: 3px;
            object-fit: cover;
        }
        .country-name {
            font-weight: 700;
            color: #1a1a2e;
            font-size: 15px;
        }
        .season-select {
            padding: 6px 10px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            background: #f9fafb;
            cursor: pointer;
            color: #1a1a2e;
            min-width: auto;
            margin-left: 4px;
        }

        .season-progress {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .progress-track {
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #1a1a2e;
            border-radius: 2px;
            transition: width 0.4s ease;
        }
        .progress-dates {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #6b7280;
            font-weight: 500;
        }

        /* ═══ ОБЩИЕ ЭЛЕМЕНТЫ ═══ */
        h2 { font-size: 24px; margin: 40px 0 20px; color: #333; }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            align-items: center;
        }
        select {
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #ddd;
            background: white;
            font-size: 16px;
            cursor: pointer;
            min-width: 220px;
        }
        .controls select { min-width: 220px; }

        /* Карточка матча */
        .match {
            background: white;
            padding: 18px 22px;
            margin: 10px 0;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .match-date {
            font-size: 15px;
            color: #888;
            min-width: 130px;
        }
        .match-teams {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        .team {
            flex: 1;
            font-size: 17px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .team.away { justify-content: flex-end; }
        .score {
            font-weight: bold;
            background: #1a1a2e;
            color: white;
            padding: 6px 16px;
            border-radius: 8px;
            min-width: 70px;
            text-align: center;
            font-size: 18px;
        }
        .score.pending { background: #ccc; font-size: 15px; }

        /* Таблица */
        .table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 12px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 16px;
            vertical-align: middle;
        }
        th {
            background: #1a1a2e;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }
        tr:last-child td { border-bottom: none; }
        .pos { font-weight: bold; color: #666; width: 40px; }
        .pts { font-weight: bold; }
        .diff { font-weight: 600; color: #555; }
        td.team-cell { white-space: nowrap; }

        .loading { color: #888; padding: 24px; text-align: center; font-size: 16px; }
        .error { color: #c00; padding: 24px; text-align: center; font-size: 16px; }

        tr.zone-champions td:first-child { border-left: 5px solid #1a5f9e; background: rgba(26, 95, 158, 0.12); }
        tr.zone-europa td:first-child { border-left: 5px solid #f58220; background: rgba(245, 130, 32, 0.15); }
        tr.zone-conference td:first-child { border-left: 5px solid #009f4f; background: rgba(0, 159, 79, 0.12); }
        tr.zone-relegation td:first-child { border-left: 5px solid #e74c3c; background: rgba(231, 76, 60, 0.1); }

        .team-logo {
            width: 36px !important;
            height: 36px !important;
            object-fit: contain;
            flex-shrink: 0;
        }
        .table-logo {
            width: 32px !important;
            height: 32px !important;
            object-fit: contain;
            vertical-align: middle;
            margin-right: 10px;
        }

        /* Легенда */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            margin-top: 14px;
            padding: 14px 18px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            font-size: 15px;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; color: #555; }
        .legend-color { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }

        /* Бомбардиры */
        .scorer {
            display: grid;
            grid-template-columns: 40px 1fr 60px;
            align-items: center;
            gap: 16px;
            background: white;
            padding: 16px 20px;
            margin: 10px 0;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            font-size: 17px;
        }
        .scorer-pos { font-weight: bold; color: #666; text-align: center; }
        .scorer-name { font-weight: 600; }
        .scorer-goals {
            font-weight: bold;
            background: #1a1a2e;
            color: white;
            padding: 5px 14px;
            border-radius: 8px;
            text-align: center;
        }

        /* Мобильная адаптация */
        @media (max-width: 600px) {
            body { padding: 14px; -webkit-text-size-adjust: 100%; }
            h2 { font-size: 20px; margin: 28px 0 14px; }

            /* Шапка на мобильном */
            .league-header { padding: 16px 18px; }
            .league-logo { width: 52px; height: 52px; }
            .league-title { font-size: 22px; }
            .followers { font-size: 12px; }
            .fav-btn { padding: 9px 14px; font-size: 11px; }
            .fav-btn .star { font-size: 13px; }
            .country-name { font-size: 14px; }

            .table-scroll {
                margin-left: -14px;
                margin-right: -14px;
                padding-left: 14px;
                padding-right: 14px;
                border-radius: 0;
            }
            .table-scroll table { min-width: 680px; }
            td.team-cell { white-space: normal; }

            .match {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
                padding: 14px;
            }
            .match-date {
                font-size: 13px;
                min-width: auto;
                text-align: center;
                color: #888;
            }
            .match-teams {
                display: grid;
                grid-template-columns: 1fr auto 1fr;
                align-items: center;
                gap: 10px;
                width: 100%;
            }
            .team {
                font-size: 15px;
                word-break: break-word;
                line-height: 1.2;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .team.away { justify-content: flex-end; }
            .score { font-size: 16px; min-width: 56px; padding: 5px 10px; }
            .score.pending { font-size: 14px; }

            .controls { flex-direction: column; align-items: stretch; }
            .controls select { width: 100%; min-width: auto; font-size: 15px; }

            th, td { padding: 10px 5px; font-size: 13px; }
            th { font-size: 12px; }
            .pos { width: 26px; }

            .team-logo { width: 26px !important; height: 26px !important; }
            .table-logo { width: 24px !important; height: 24px !important; }

            .legend { gap: 12px; padding: 12px 14px; font-size: 13px; }
            .legend-color { width: 12px; height: 12px; }

            .scorer {
                grid-template-columns: 28px 1fr 44px;
                gap: 10px;
                padding: 12px 14px;
                font-size: 15px;
            }
            .scorer-goals { padding: 4px 10px; font-size: 14px; }
        }

        @media (max-width: 400px) {
            .league-title { font-size: 20px; }
            .fav-btn { padding: 8px 10px; }
            .fav-btn .btn-text { display: none; }
            .team { font-size: 14px; }
            .score { font-size: 15px; min-width: 50px; padding: 4px 8px; }
            th, td { padding: 8px 4px; font-size: 12px; }
            .pos { width: 22px; }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- ═══ ШАПКА ЛИГИ ═══ -->
        <header class="league-header">
            <div class="league-top">
                <img class="league-logo"
                     src="https://upload.wikimedia.org/wikipedia/en/f/f9/Bundesliga_logo_%282017%29.svg"
                     alt="Bundesliga">
                <div class="league-title-block">
                    <h1 class="league-title">Bundesliga <span id="headerSeason">2024/2025</span></h1>
                    <div class="followers"><b>588k</b> followers</div>
                </div>
                <button class="fav-btn">
                    <span class="star">★</span>
                    <span class="btn-text">FAVOURITE</span>
                </button>
            </div>

            <div class="league-sub">
                <img class="country-flag"
                     src="https://flagcdn.com/w40/de.png"
                     alt="Germany">
                <span class="country-name">Germany</span>
                <select id="seasonFilter" class="season-select">
                    <option value="2024">24/25</option>
                    <option value="2023">23/24</option>
                    <option value="2022">22/23</option>
                    <option value="2021">21/22</option>
                    <option value="2020">20/21</option>
                    <option value="2019">19/20</option>
                </select>
            </div>

            <div class="season-progress">
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
                </div>
                <div class="progress-dates">
                    <span>28 Aug</span>
                    <span>31 May</span>
                </div>
            </div>
        </header>

        <!-- ═══ ТУРНИРНАЯ ТАБЛИЦА ═══ -->
        <h2>Турнирная таблица</h2>
        <div id="table" class="loading">Загрузка таблицы...</div>

        <div class="legend">
            <div class="legend-item">
                <span class="legend-color" style="background: #1a5f9e;"></span>
                <span>Лига Чемпионов (1–4)</span>
            </div>
            <div class="legend-item">
                <span class="legend-color" style="background: #f58220;"></span>
                <span>Лига Европы (5)</span>
            </div>
            <div class="legend-item">
                <span class="legend-color" style="background: #009f4f;"></span>
                <span>Лига конференций (6)</span>
            </div>
            <div class="legend-item">
                <span class="legend-color" style="background: #e74c3c;"></span>
                <span>Зона вылета (16–18)</span>
            </div>
        </div>

        <!-- ═══ МАТЧИ ═══ -->
        <h2>Матчи</h2>
        <div class="controls">
            <select id="roundFilter">
                <option value="all">Все туры</option>
            </select>
        </div>
        <div id="matches" class="loading">Загрузка матчей...</div>

        <!-- ═══ БОМБАРДИРЫ ═══ -->
        <h2>Бомбардиры</h2>
        <div id="scorers" class="loading">Загрузка бомбардиров...</div>
    </div>

    <script>
        const API_BASE = 'https://api.openligadb.de';
        const LEAGUE = 'bl1';

        let currentSeason = '2024';
        let allMatches = [];

        function updateTitle() {
            const year = parseInt(currentSeason);
            const next = year + 1;
            document.getElementById('headerSeason').textContent = `${year}/${next}`;
            updateProgress();
        }

        function updateProgress() {
            const year = parseInt(currentSeason);
            const start = new Date(year, 7, 28);     // 28 августа
            const end = new Date(year + 1, 4, 31);   // 31 мая
            const now = new Date();
            let percent = ((now - start) / (end - start)) * 100;
            if (percent < 0) percent = 0;
            if (percent > 100) percent = 100;
            document.getElementById('progressFill').style.width = percent + '%';
        }

        function formatDate(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            return d.toLocaleDateString('ru-RU', {
                day: '2-digit', month: '2-digit', year: 'numeric'
            });
        }

        async function loadMatches() {
            try {
                const res = await fetch(`${API_BASE}/getmatchdata/${LEAGUE}/${currentSeason}`);
                allMatches = await res.json();

                const filter = document.getElementById('roundFilter');
                filter.innerHTML = '<option value="all">Все туры</option>';

                const rounds = [...new Set(allMatches.map(m => m.group?.groupName).filter(Boolean))];
                rounds.forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = r;
                    const match = r.match(/^(\d+)\.\s*Spieltag$/i);
                    opt.textContent = match ? `${match[1]}-й тур` : r;
                    filter.appendChild(opt);
                });

                renderMatches('all');
            } catch (e) {
                document.getElementById('matches').innerHTML =
                    '<div class="error">Ошибка загрузки матчей</div>';
            }
        }

        function renderMatches(round) {
            const container = document.getElementById('matches');
            let list = allMatches;
            if (round !== 'all') {
                list = allMatches.filter(m => m.group?.groupName === round);
            }

            if (list.length === 0) {
                container.innerHTML = '<div class="loading">Нет матчей</div>';
                return;
            }

            container.innerHTML = list.map(m => {
                const result = m.matchResults?.[0];
                const isFinished = result && m.matchIsFinished;
                const score = isFinished
                    ? `${result.pointsTeam1} : ${result.pointsTeam2}`
                    : '—';
                const scoreClass = isFinished ? 'score' : 'score pending';

                return `
                    <div class="match">
                        <div class="match-date">${formatDate(m.matchDateTime)}</div>
                        <div class="match-teams">
                            <span class="team">
                                <img src="${m.team1.teamIconUrl}" alt="" class="team-logo">
                                ${m.team1.teamName}
                            </span>
                            <span class="${scoreClass}">${score}</span>
                            <span class="team away">
                                ${m.team2.teamName}
                                <img src="${m.team2.teamIconUrl}" alt="" class="team-logo">
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function loadTable() {
            try {
                const stats = {};

                allMatches.forEach(m => {
                    if (!m.matchIsFinished) return;
                    const result = m.matchResults?.[0];
                    if (!result) return;

                    const t1 = m.team1.teamName;
                    const t2 = m.team2.teamName;
                    const g1 = result.pointsTeam1;
                    const g2 = result.pointsTeam2;

                    if (!stats[t1]) stats[t1] = { name: t1, logo: m.team1.teamIconUrl, matches: 0, won: 0, draw: 0, lost: 0, gf: 0, ga: 0, points: 0 };
                    if (!stats[t2]) stats[t2] = { name: t2, logo: m.team2.teamIconUrl, matches: 0, won: 0, draw: 0, lost: 0, gf: 0, ga: 0, points: 0 };

                    stats[t1].matches++;
                    stats[t2].matches++;
                    stats[t1].gf += g1;
                    stats[t1].ga += g2;
                    stats[t2].gf += g2;
                    stats[t2].ga += g1;

                    if (g1 > g2) {
                        stats[t1].won++; stats[t1].points += 3;
                        stats[t2].lost++;
                    } else if (g1 < g2) {
                        stats[t2].won++; stats[t2].points += 3;
                        stats[t1].lost++;
                    } else {
                        stats[t1].draw++; stats[t1].points += 1;
                        stats[t2].draw++; stats[t2].points += 1;
                    }
                });

                const data = Object.values(stats).sort((a, b) => {
                    if (b.points !== a.points) return b.points - a.points;
                    const diffA = a.gf - a.ga;
                    const diffB = b.gf - b.ga;
                    if (diffB !== diffA) return diffB - diffA;
                    return b.gf - a.gf;
                });

                const rows = data.map((t, i) => {
                    const pos = i + 1;
                    const diff = t.gf - t.ga;
                    const diffText = diff > 0 ? `+${diff}` : `${diff}`;

                    let rowClass = '';
                    if (pos <= 4) rowClass = 'zone-champions';
                    else if (pos === 5) rowClass = 'zone-europa';
                    else if (pos === 6) rowClass = 'zone-conference';
                    else if (pos >= 16) rowClass = 'zone-relegation';

                    return `
                        <tr class="${rowClass}">
                            <td class="pos">${pos}</td>
                            <td class="team-cell"><img src="${t.logo}" alt="" class="table-logo">${t.name}</td>
                            <td>${t.matches}</td>
                            <td>${t.won}</td>
                            <td>${t.draw}</td>
                            <td>${t.lost}</td>
                            <td>${t.gf}</td>
                            <td>${t.ga}</td>
                            <td class="diff">${diffText}</td>
                            <td class="pts">${t.points}</td>
                        </tr>
                    `;
                }).join('');

                document.getElementById('table').innerHTML = `
                    <div class="table-scroll">
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Команда</th>
                                    <th>И</th>
                                    <th>В</th>
                                    <th>Н</th>
                                    <th>П</th>
                                    <th>ЗМ</th>
                                    <th>ПМ</th>
                                    <th>РМ</th>
                                    <th>О</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                `;
            } catch (e) {
                document.getElementById('table').innerHTML =
                    '<div class="error">Ошибка загрузки таблицы</div>';
            }
        }

        async function loadScorers() {
            try {
                const res = await fetch(`${API_BASE}/getgoalgetters/${LEAGUE}/${currentSeason}`);
                const data = await res.json();

                const top = data
                    .sort((a, b) => b.goalCount - a.goalCount)
                    .slice(0, 10);

                const rows = top.map((s, i) => `
                    <div class="scorer">
                        <span class="scorer-pos">${i + 1}</span>
                        <span class="scorer-name">${s.goalGetterName}</span>
                        <span class="scorer-goals">${s.goalCount}</span>
                    </div>
                `).join('');

                document.getElementById('scorers').innerHTML = rows;
            } catch (e) {
                document.getElementById('scorers').innerHTML =
                    '<div class="error">Ошибка загрузки бомбардиров</div>';
            }
        }

        document.getElementById('seasonFilter').addEventListener('change', async (e) => {
            currentSeason = e.target.value;
            updateTitle();
            document.getElementById('matches').innerHTML = '<div class="loading">Загрузка матчей...</div>';
            document.getElementById('table').innerHTML = '<div class="loading">Загрузка таблицы...</div>';
            document.getElementById('scorers').innerHTML = '<div class="loading">Загрузка бомбардиров...</div>';
            await loadMatches();
            await loadTable();
            await loadScorers();
        });

        document.getElementById('roundFilter').addEventListener('change', (e) => {
            renderMatches(e.target.value);
        });

        (async () => {
            updateTitle();
            await loadMatches();
            await loadTable();
            await loadScorers();
        })();
    </script>
</body>
</html>
