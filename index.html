<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 Boxes — Открывай боксы</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.5;
        }
        .container { max-width: 1200px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 24px; }
        .header h1 {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #ffd700, #ff6b6b, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .header p { color: #94a3b8; font-size: 15px; }

        .category-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .cat-tab {
            background: rgba(255,255,255,0.06);
            border: 2px solid rgba(255,255,255,0.1);
            color: #cbd5e1;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .cat-tab:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .cat-tab.active {
            background: linear-gradient(135deg, #ffd700, #ff9500);
            color: #1a1a2e;
            border-color: transparent;
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.35);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .stat {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 22px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-value { font-size: 24px; font-weight: 900; color: #ffd700; }
        .stat-label { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }

        .open-zone {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            border: 2px dashed rgba(255,255,255,0.1);
        }
        .box-visual {
            margin-bottom: 20px;
            display: inline-block;
            transition: transform 0.3s;
            font-size: 100px;
            line-height: 1;
        }
        .box-visual img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 40px rgba(168,85,247,0.6));
        }
        .box-visual.shaking { animation: shake 0.5s infinite; }
        @keyframes shake {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-10deg) scale(1.05); }
            75% { transform: rotate(10deg) scale(1.05); }
        }
        .open-btn {
            background: linear-gradient(135deg, #ffd700, #ff9500);
            color: #1a1a2e;
            border: none;
            padding: 16px 48px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 12px;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 8px 24px rgba(255, 215, 0, 0.3);
            transition: transform 0.15s, box-shadow 0.15s;
            font-family: inherit;
        }
        .open-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255, 215, 0, 0.5); }
        .open-btn:active:not(:disabled) { transform: translateY(0); }
        .open-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .reveal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .reveal-overlay.active { display: flex; }

        .reveal-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 3px solid #475569;
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .reveal-card.common   { border-color: #94a3b8; box-shadow: 0 0 40px rgba(148,163,184,0.5); }
        .reveal-card.rare     { border-color: #3b82f6; box-shadow: 0 0 60px rgba(59,130,246,0.7); }
        .reveal-card.epic     { border-color: #a855f7; box-shadow: 0 0 70px rgba(168,85,247,0.8); }
        .reveal-card.legendary{ border-color: #f59e0b; box-shadow: 0 0 90px rgba(245,158,11,0.9); }
        .reveal-card.mythical { border-color: #ef4444; box-shadow: 0 0 120px rgba(239,68,68,1); }

        .reveal-rarity {
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }
        .reveal-card.common    .reveal-rarity { color: #94a3b8; }
        .reveal-card.rare      .reveal-rarity { color: #60a5fa; }
        .reveal-card.epic      .reveal-rarity { color: #c084fc; }
        .reveal-card.legendary .reveal-rarity { color: #fbbf24; }
        .reveal-card.mythical  .reveal-rarity { color: #f87171; }

        .reveal-emoji {
            margin: 12px 0 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 180px;
        }
        .reveal-stone {
            width: 180px;
            height: 180px;
            object-fit: contain;
            animation: floatStone 2s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(255,255,255,0.3));
        }
        .reveal-emoji-symbol {
            font-size: 110px;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.3));
        }
        @keyframes floatStone {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .reveal-name { font-size: 26px; font-weight: 900; margin-bottom: 8px; }
        .reveal-desc { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
        .reveal-close {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px 32px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s;
            font-family: inherit;
        }
        .reveal-close:hover { background: rgba(255,255,255,0.2); }

        .collection-title {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .collection-title .count { font-size: 14px; color: #94a3b8; font-weight: 500; }
        .collection {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }
        .hero-card {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 16px 10px;
            text-align: center;
            transition: transform 0.15s;
            position: relative;
        }
        .hero-card:hover { transform: translateY(-3px); }
        .hero-card.locked { opacity: 0.4; }
        .hero-card.locked .hero-img { filter: grayscale(1) brightness(0.5); }
        .hero-card.locked .hero-emoji { filter: grayscale(1); }
        .hero-card.common    { border-color: #94a3b8; }
        .hero-card.rare      { border-color: #3b82f6; }
        .hero-card.epic      { border-color: #a855f7; }
        .hero-card.legendary { border-color: #f59e0b; }
        .hero-card.mythical  { border-color: #ef4444; }

        .hero-img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            margin-bottom: 8px;
        }
        .hero-emoji { font-size: 42px; margin-bottom: 8px; }
        .hero-name { font-size: 13px; font-weight: 700; line-height: 1.2; margin-bottom: 4px; }
        .hero-count { font-size: 11px; color: #94a3b8; }
        .hero-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 10px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(0,0,0,0.3);
            text-transform: uppercase;
        }
        .hero-card.common    .hero-badge { color: #94a3b8; }
        .hero-card.rare      .hero-badge { color: #60a5fa; }
        .hero-card.epic      .hero-badge { color: #c084fc; }
        .hero-card.legendary .hero-badge { color: #fbbf24; }
        .hero-card.mythical  .hero-badge { color: #f87171; }

        @media (max-width: 600px) {
            body { padding: 14px; }
            .header h1 { font-size: 30px; }
            .cat-tab { padding: 10px 16px; font-size: 13px; }
            .box-visual { font-size: 70px; }
            .box-visual img { width: 100px; height: 100px; }
            .open-btn { padding: 14px 32px; font-size: 16px; }
            .reveal-stone { width: 140px; height: 140px; }
            .reveal-emoji-symbol { font-size: 80px; }
            .reveal-name { font-size: 22px; }
            .collection { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
            .hero-emoji { font-size: 34px; }
            .hero-img { width: 50px; height: 50px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎁 BOXES</h1>
            <p>Открывай боксы — собирай коллекцию</p>
        </div>

        <div class="category-tabs">
            <button class="cat-tab active" data-cat="anime">🎌 Аниме персонажи</button>
            <button class="cat-tab" data-cat="gems">💎 Драгоценные камни</button>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="statOpened">0</div>
                <div class="stat-label">Открыто</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="statCollected">0</div>
                <div class="stat-label">Собрано</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="statTotal">0</div>
                <div class="stat-label">Всего</div>
            </div>
        </div>

        <div class="open-zone">
            <div class="box-visual" id="boxVisual"></div>
            <br>
            <button class="open-btn" id="openBtn">ОТКРЫТЬ БОКС</button>
        </div>

        <div class="collection-title">
            Коллекция <span class="count" id="collectionCount"></span>
        </div>
        <div class="collection" id="collection"></div>
    </div>

    <div class="reveal-overlay" id="revealOverlay">
        <div class="reveal-card" id="revealCard">
            <div class="reveal-rarity" id="revealRarity"></div>
            <div class="reveal-emoji" id="revealEmoji"></div>
            <div class="reveal-name" id="revealName"></div>
            <div class="reveal-desc" id="revealDesc"></div>
            <button class="reveal-close" id="revealClose">Забрать</button>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════
        //  🎌 АНИМЕ ПЕРСОНАЖИ (эмодзи)
        // ═══════════════════════════════════════════════
        const ANIME_HEROES = [
            { id: 'gojo',     name: 'Годжо',       emoji: '🥷', rarity: 'legendary', desc: 'Сильнейший' },
            { id: 'naruto',   name: 'Наруто',      emoji: '🍥', rarity: 'epic',      desc: 'Хокаге' },
            { id: 'goku',     name: 'Гоку',        emoji: '🔥', rarity: 'mythical',  desc: 'Супер Саян' },
            { id: 'luffy',    name: 'Луффи',       emoji: '🏴‍☠️', rarity: 'legendary', desc: 'Король пиратов' },
            { id: 'zoro',     name: 'Зоро',        emoji: '⚔️', rarity: 'epic',      desc: 'Трёхмечевой' },
            { id: 'saitama',  name: 'Сайтама',     emoji: '👊', rarity: 'mythical',  desc: 'One Punch' },
            { id: 'levi',     name: 'Леви',        emoji: '🗡️', rarity: 'epic',      desc: 'Сильнейший солдат' },
            { id: 'sasuke',   name: 'Саске',       emoji: '🌩️', rarity: 'rare',      desc: 'Мститель' },
            { id: 'ichigo',   name: 'Ичиго',       emoji: '💀', rarity: 'rare',      desc: 'Синигами' },
            { id: 'killua',   name: 'Киллуа',      emoji: '⚡', rarity: 'epic',      desc: 'Охотник' },
            { id: 'tanjiro',  name: 'Танджиро',    emoji: '🌊', rarity: 'rare',      desc: 'Истребитель' },
            { id: 'deku',     name: 'Деку',        emoji: '💪', rarity: 'rare',      desc: 'One For All' },
            { id: 'bakugo',   name: 'Бакуго',      emoji: '💥', rarity: 'epic',      desc: 'Взрыв' },
            { id: 'eren',     name: 'Эрен',        emoji: '👁️', rarity: 'legendary', desc: 'Титан' },
            { id: 'mikasa',   name: 'Микаса',      emoji: '🧣', rarity: 'rare',      desc: 'Аккерман' },
            { id: 'vegeta',   name: 'Вегета',      emoji: '👑', rarity: 'epic',      desc: 'Принц Саянов' },
            { id: 'sanji',    name: 'Санджи',      emoji: '🚬', rarity: 'rare',      desc: 'Кок' },
            { id: 'hinata',   name: 'Хината',      emoji: '🏐', rarity: 'common',    desc: 'Волейбол' },
            { id: 'rimuru',   name: 'Римуру',      emoji: '🟦', rarity: 'legendary', desc: 'Слизь' },
            { id: 'ainz',     name: 'Айнз',        emoji: '💀', rarity: 'legendary', desc: 'Скелет' },
        ];

        // ═══════════════════════════════════════════════
        //  💎 ДРАГОЦЕННЫЕ КАМНИ (картинки .jpg из stones/)
        // ═══════════════════════════════════════════════
        const GEM_HEROES = [
            { id: 'diamond',     name: 'Алмаз',         img: 'stones/diamond.jpg',     rarity: 'mythical',  desc: 'Твёрдость 10' },
            { id: 'alexandrite', name: 'Александрит',   img: 'stones/alexandrite.jpg', rarity: 'legendary', desc: 'Меняет цвет' },
            { id: 'ruby',        name: 'Рубин',         img: 'stones/ruby.jpg',        rarity: 'legendary', desc: 'Камень страсти' },
            { id: 'emerald',     name: 'Изумруд',       img: 'stones/emerald.jpg',     rarity: 'legendary', desc: 'Камень царей' },
            { id: 'sapphire',    name: 'Сапфир',        img: 'stones/sapphire.jpg',    rarity: 'legendary', desc: 'Небесный камень' },
            { id: 'amethyst',    name: 'Аметист',       img: 'stones/amethyst.jpg',    rarity: 'epic',      desc: 'Защита от сглаза' },
            { id: 'topaz',       name: 'Топаз',         img: 'stones/topaz.jpg',       rarity: 'epic',      desc: 'Солнечный камень' },
            { id: 'opal',        name: 'Опал',          img: 'stones/opal.jpg',        rarity: 'epic',      desc: 'Все цвета радуги' },
            { id: 'moonstone',   name: 'Лунный камень', img: 'stones/moonstone.jpg',   rarity: 'epic',      desc: 'Свет луны' },
            { id: 'aquamarine',  name: 'Аквамарин',     img: 'stones/aquamarine.jpg',  rarity: 'rare',      desc: 'Морская волна' },
            { id: 'garnet',      name: 'Гранат',        img: 'stones/garnet.jpg',      rarity: 'rare',      desc: 'Огонь и страсть' },
            { id: 'tourmaline',  name: 'Турмалин',      img: 'stones/tourmaline.jpg',  rarity: 'rare',      desc: 'Радужный камень' },
            { id: 'malachite',   name: 'Малахит',       img: 'stones/malachite.jpg',   rarity: 'rare',      desc: 'Зелёный узор' },
            { id: 'obsidian',    name: 'Обсидиан',      img: 'stones/obsidian.jpg',    rarity: 'rare',      desc: 'Вулканическое стекло' },
            { id: 'pearl',       name: 'Жемчуг',        img: 'stones/pearl.jpg',       rarity: 'rare',      desc: 'Слёзы моря' },
            { id: 'agate',       name: 'Агат',          img: 'stones/agate.jpg',       rarity: 'common',    desc: 'Полосатый камень' },
            { id: 'quartz',      name: 'Кварц',         img: 'stones/quartz.jpg',      rarity: 'common',    desc: 'Прозрачный кристалл' },
            { id: 'amber',       name: 'Янтарь',        img: 'stones/amber.jpg',       rarity: 'common',    desc: 'Солнечная смола' },
            { id: 'onyx',        name: 'Оникс',         img: 'stones/onyx.jpg',        rarity: 'common',    desc: 'Чёрный камень' },
            { id: 'pyrite',      name: 'Пирит',         img: 'stones/pyrite.jpg',      rarity: 'common',    desc: 'Золото дураков' },
        ];

        // ═══════════════════════════════════════════════
        //  КАТЕГОРИИ
        // ═══════════════════════════════════════════════
        const CATEGORIES = {
            anime: {
                name: 'Аниме персонажи',
                boxEmoji: '📦',
                boxImg: null,
                heroes: ANIME_HEROES,
            },
            gems: {
                name: 'Драгоценные камни',
                boxEmoji: null,
                boxImg: 'stones/opal.jpg',
                heroes: GEM_HEROES,
            },
        };

        const RARITY_CHANCES = {
            common:    55,
            rare:      25,
            epic:      13,
            legendary:  6,
            mythical:   1,
        };

        const RARITY_NAMES = {
            common:    'Обычный',
            rare:      'Редкий',
            epic:      'Эпический',
            legendary: 'Легендарный',
            mythical:  'Мифический',
        };

        // ═══════════════════════════════════════════════
        //  ЛОГИКА
        // ═══════════════════════════════════════════════
        const STORAGE_KEY = 'boxes_progress_v2';

        let currentCategory = 'anime';
        let state = {
            opened: {},
            owned: {},
        };

        function initState() {
            for (const cat of Object.keys(CATEGORIES)) {
                if (state.opened[cat] === undefined) state.opened[cat] = 0;
                if (!state.owned[cat]) state.owned[cat] = {};
            }
        }

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) state = JSON.parse(raw);
            } catch (e) { /* ignore */ }
            initState();
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function getHeroes() {
            return CATEGORIES[currentCategory].heroes;
        }

        function rollRarity() {
            const roll = Math.random() * 100;
            let acc = 0;
            for (const [rarity, chance] of Object.entries(RARITY_CHANCES)) {
                acc += chance;
                if (roll < acc) return rarity;
            }
            return 'common';
        }

        function pickHero(rarity) {
            const heroes = getHeroes();
            const pool = heroes.filter(h => h.rarity === rarity);
            if (pool.length === 0) {
                return heroes[Math.floor(Math.random() * heroes.length)];
            }
            return pool[Math.floor(Math.random() * pool.length)];
        }

        async function openBox() {
            const btn = document.getElementById('openBtn');
            const box = document.getElementById('boxVisual');
            btn.disabled = true;
            box.classList.add('shaking');

            await new Promise(r => setTimeout(r, 900));
            box.classList.remove('shaking');

            const rarity = rollRarity();
            const hero = pickHero(rarity);

            state.opened[currentCategory]++;
            state.owned[currentCategory][hero.id] = (state.owned[currentCategory][hero.id] || 0) + 1;
            saveState();

            showReveal(hero);
            renderStats();
            renderCollection();

            btn.disabled = false;
        }

        function showReveal(hero) {
            const overlay = document.getElementById('revealOverlay');
            const card = document.getElementById('revealCard');
            const visualEl = document.getElementById('revealEmoji');

            card.className = 'reveal-card ' + hero.rarity;
            document.getElementById('revealRarity').textContent = RARITY_NAMES[hero.rarity];

            if (hero.img) {
                visualEl.innerHTML = `<img src="${hero.img}" alt="${hero.name}" class="reveal-stone">`;
            } else {
                visualEl.innerHTML = `<div class="reveal-emoji-symbol">${hero.emoji}</div>`;
            }

            document.getElementById('revealName').textContent = hero.name;
            document.getElementById('revealDesc').textContent = hero.desc || '';

            overlay.classList.add('active');
        }

        function closeReveal() {
            document.getElementById('revealOverlay').classList.remove('active');
        }

        function renderStats() {
            const heroes = getHeroes();
            const opened = state.opened[currentCategory] || 0;
            const collected = Object.keys(state.owned[currentCategory] || {}).length;

            document.getElementById('statOpened').textContent = opened;
            document.getElementById('statCollected').textContent = collected;
            document.getElementById('statTotal').textContent = heroes.length;
        }

        function renderCollection() {
            const container = document.getElementById('collection');
            const heroes = getHeroes();
            const owned = state.owned[currentCategory] || {};

            const sorted = [...heroes].sort((a, b) => {
                const order = ['mythical', 'legendary', 'epic', 'rare', 'common'];
                return order.indexOf(a.rarity) - order.indexOf(b.rarity);
            });

            container.innerHTML = sorted.map(h => {
                const count = owned[h.id] || 0;
                const locked = count === 0;

                let visual;
                if (h.img) {
                    visual = `<img src="${h.img}" alt="" class="hero-img">`;
                } else {
                    visual = `<div class="hero-emoji">${locked ? '❓' : h.emoji}</div>`;
                }

                return `
                    <div class="hero-card ${h.rarity} ${locked ? 'locked' : ''}">
                        <div class="hero-badge">${RARITY_NAMES[h.rarity].slice(0, 3)}</div>
                        ${visual}
                        <div class="hero-name">${locked ? '???' : h.name}</div>
                        <div class="hero-count">${locked ? 'не найден' : `×${count}`}</div>
                    </div>
                `;
            }).join('');

            const collected = Object.keys(owned).length;
            document.getElementById('collectionCount').textContent = `${collected} / ${heroes.length}`;
        }

        function renderBox() {
            const cat = CATEGORIES[currentCategory];
            const el = document.getElementById('boxVisual');
            if (cat.boxImg) {
                el.innerHTML = `<img src="${cat.boxImg}" alt="Box">`;
            } else {
                el.textContent = cat.boxEmoji;
            }
        }

        function switchCategory(cat) {
            if (cat === currentCategory) return;
            currentCategory = cat;

            document.querySelectorAll('.cat-tab').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.cat === cat);
            });

            renderBox();
            renderStats();
            renderCollection();
        }

        document.getElementById('openBtn').addEventListener('click', openBox);
        document.getElementById('revealClose').addEventListener('click', closeReveal);
        document.getElementById('revealOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'revealOverlay') closeReveal();
        });

        document.querySelectorAll('.cat-tab').forEach(btn => {
            btn.addEventListener('click', () => switchCategory(btn.dataset.cat));
        });

        loadState();
        renderBox();
        renderStats();
        renderCollection();
    </script>
</body>
</html>
