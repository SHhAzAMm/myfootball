<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Осада — Boxes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #fff;
    overflow: hidden;
  }
  .shell {
    display: flex; flex-direction: column;
    height: 100dvh; max-width: 480px; margin: 0 auto;
    padding: 12px; gap: 10px;
  }

  /* ═══ HEADER ═══ */
  .header {
    display: flex; align-items: center; justify-content: center;
    padding: 14px;
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 12px; flex-shrink: 0;
  }
  .header-title {
    font-size: 20px; font-weight: 900; letter-spacing: 4px;
    background: linear-gradient(90deg, #ffd700, #ff6b6b, #a855f7);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* ═══ CONTENT ═══ */
  .content {
    flex: 1; min-height: 0;
    background: rgba(255,255,255,0.03);
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 14px; padding: 16px 14px;
    overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .content.center-content { align-items: center; justify-content: center; }

  .content-placeholder {
    text-align: center; color: #64748b;
    font-size: 14px; line-height: 1.6;
  }
  .content-placeholder .icon { font-size: 56px; display: block; margin-bottom: 14px; }
  .content-placeholder b { color: #cbd5e1; font-size: 18px; display: block; margin-bottom: 6px; }

  /* ═══ DECK TAB ═══ */
  .deck-section-title {
    font-size: 11px; font-weight: 900; letter-spacing: 2px;
    text-transform: uppercase; color: #94a3b8;
    margin-bottom: 10px; text-align: center;
  }
  .deck-section-title + .deck-grid { margin-bottom: 22px; }

  .deck-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .deck-slot {
    aspect-ratio: 1;
    background: rgba(255,255,255,0.03);
    border: 2px dashed rgba(255,255,255,0.15);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }
  .deck-slot.filled {
    border-style: solid;
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.25);
  }
  .deck-slot.filled:hover { transform: scale(1.05); border-color: #a855f7; box-shadow: 0 0 12px rgba(168,85,247,0.4); }
  .deck-slot img { width: 85%; height: 85%; object-fit: contain; image-rendering: pixelated; pointer-events: none; }
  .deck-slot .slot-emoji { font-size: 30px; line-height: 1; pointer-events: none; }
  .deck-slot .slot-empty { color: #475569; font-size: 22px; font-weight: 900; pointer-events: none; }

  .char-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .char-cell {
    aspect-ratio: 1;
    background: rgba(255,255,255,0.04);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s;
    position: relative; padding: 4px;
    overflow: hidden;
  }
  .char-cell:hover { background: rgba(255,255,255,0.08); transform: scale(1.05); }
  .char-cell.in-deck { border-color: #a855f7; box-shadow: 0 0 12px rgba(168,85,247,0.4); }
  .char-cell.locked { opacity: 0.35; cursor: not-allowed; }
  .char-cell.locked:hover { transform: none; background: rgba(255,255,255,0.04); }
  .char-cell img { width: 85%; height: 85%; object-fit: contain; image-rendering: pixelated; pointer-events: none; }
  .char-cell .char-emoji { font-size: 28px; line-height: 1; pointer-events: none; }
  .char-cell .lock-overlay {
    position: absolute; top: 3px; right: 3px;
    font-size: 14px; opacity: 0.9;
  }
  .char-cell .in-deck-badge {
    position: absolute; top: 3px; left: 3px;
    background: #a855f7; color: #fff;
    font-size: 9px; font-weight: 900;
    padding: 1px 5px; border-radius: 6px;
  }

  /* ═══ PLAY BUTTON ═══ */
  .play-btn {
    flex-shrink: 0; padding: 18px;
    background: linear-gradient(135deg, #ffd700, #ff9500);
    color: #1a1a2e; border: none; border-radius: 12px;
    font-size: 20px; font-weight: 900; letter-spacing: 3px;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 8px 24px rgba(255, 215, 0, 0.4);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .play-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(255, 215, 0, 0.6); }
  .play-btn:active { transform: translateY(0); }

  /* ═══ TABS ═══ */
  .tabs {
    flex-shrink: 0; display: grid;
    grid-template-columns: repeat(4, 1fr); gap: 6px;
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 10px 4px;
    background: rgba(255,255,255,0.04);
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 10px; color: #94a3b8;
    font-size: 10px; font-weight: 900; letter-spacing: 0.5px;
    cursor: pointer; font-family: inherit; transition: all 0.15s;
  }
  .tab .tab-icon { font-size: 20px; line-height: 1; }
  .tab:hover { background: rgba(255,255,255,0.08); color: #cbd5e1; }
  .tab.active {
    background: linear-gradient(135deg, rgba(168,85,247,0.2), rgba(124,58,237,0.15));
    border-color: #a855f7; color: #c084fc;
    box-shadow: 0 0 16px rgba(168, 85, 247, 0.3);
  }
  .tab.exit-tab { color: #fbbf24; border-color: rgba(251, 191, 36, 0.2); }
  .tab.exit-tab:hover { background: rgba(251, 191, 36, 0.1); border-color: rgba(251, 191, 36, 0.5); }
  .tab.battle-tab { color: #ef4444; border-color: rgba(239, 68, 68, 0.25); }
  .tab.battle-tab:hover { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.6); color: #f87171; }
  .tab.battle-tab.active {
    background: linear-gradient(135deg, rgba(239,68,68,0.25), rgba(220,38,38,0.15));
    border-color: #ef4444; color: #f87171;
    box-shadow: 0 0 16px rgba(239, 68, 68, 0.4);
  }

  /* ═══ CARD MODAL ═══ */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .overlay.active { display: flex; }
  .card-modal {
    background: linear-gradient(135deg, #1e293b, #0f172a);
    border-radius: 20px;
    padding: 32px 28px 24px;
    max-width: 380px; width: 100%;
    text-align: center; position: relative;
    border: 3px solid #475569;
    animation: pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-height: 90vh; overflow-y: auto;
  }
  @keyframes pop { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .card-modal.common    { border-color: #94a3b8; box-shadow: 0 0 40px rgba(148,163,184,0.4); }
  .card-modal.rare      { border-color: #3b82f6; box-shadow: 0 0 50px rgba(59,130,246,0.5); }
  .card-modal.epic      { border-color: #a855f7; box-shadow: 0 0 60px rgba(168,85,247,0.6); }
  .card-modal.legendary { border-color: #f59e0b; box-shadow: 0 0 70px rgba(245,158,11,0.7); }
  .card-modal.mythical  { border-color: #ef4444; box-shadow: 0 0 80px rgba(239,68,68,0.8); }

  .card-modal-x {
    position: absolute; top: 12px; right: 12px;
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #cbd5e1; font-size: 18px;
    cursor: pointer; font-family: inherit;
    line-height: 1;
  }
  .card-modal-x:hover { background: rgba(255,255,255,0.18); }

  .card-modal-rarity {
    font-size: 12px; font-weight: 900; letter-spacing: 4px;
    text-transform: uppercase; margin-bottom: 18px;
  }
  .card-modal.common    .card-modal-rarity { color: #94a3b8; }
  .card-modal.rare      .card-modal-rarity { color: #60a5fa; }
  .card-modal.epic      .card-modal-rarity { color: #c084fc; }
  .card-modal.legendary .card-modal-rarity { color: #fbbf24; }
  .card-modal.mythical  .card-modal-rarity { color: #f87171; }

  .card-modal-sprite {
    width: 180px; height: 180px;
    margin: 0 auto 18px;
    display: flex; align-items: center; justify-content: center;
    filter: drop-shadow(0 0 30px rgba(255,255,255,0.15));
  }
  .card-modal-sprite img { max-width: 100%; max-height: 100%; image-rendering: pixelated; }
  .card-modal-sprite .emoji-fallback { font-size: 110px; line-height: 1; }

  .card-modal-name {
    font-size: 26px; font-weight: 900; margin-bottom: 10px;
  }
  .card-modal-desc {
    font-size: 13px; color: #94a3b8; line-height: 1.6;
    margin-bottom: 24px; min-height: 40px;
  }
  .card-modal-btn {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, #a855f7, #7c3aed);
    color: #fff; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 900; letter-spacing: 2px;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4);
    transition: all 0.15s;
  }
  .card-modal-btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.15); }
  .card-modal-btn:disabled {
    background: rgba(255,255,255,0.06); color: #475569;
    cursor: not-allowed; box-shadow: none;
  }
  .card-modal-btn.remove {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
  }

  @media (max-width: 400px) {
    .header-title { font-size: 16px; letter-spacing: 3px; }
    .play-btn { font-size: 17px; padding: 15px; }
    .tab { padding: 8px 2px; font-size: 9px; }
    .tab .tab-icon { font-size: 18px; }
    .content-placeholder .icon { font-size: 44px; }
    .card-modal-sprite { width: 140px; height: 140px; }
    .card-modal-sprite .emoji-fallback { font-size: 80px; }
    .card-modal-name { font-size: 22px; }
    .card-modal { padding: 28px 20px 20px; }
  }

  /* ═══ РЫНОК ═══ */
  .market-card {
    display: flex; flex-direction: column; align-items: center;
    text-align: center; width: 100%;
  }
  .market-icon { font-size: 72px; margin-bottom: 14px; }
  .market-title {
    font-size: 22px; font-weight: 900; margin-bottom: 10px;
    background: linear-gradient(90deg, #a855f7, #ec4899);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .market-desc {
    font-size: 13px; color: #94a3b8; line-height: 1.6;
    margin-bottom: 20px; max-width: 320px;
  }
  .market-cost {
    background: rgba(168,85,247,0.08);
    border: 2px solid rgba(168,85,247,0.35);
    border-radius: 12px;
    padding: 12px 24px;
    margin-bottom: 18px;
  }
  .market-cost-label {
    font-size: 10px; color: #94a3b8;
    letter-spacing: 3px; margin-bottom: 4px;
  }
  .market-cost-value {
    font-size: 24px; font-weight: 900; color: #a855f7;
  }
  .market-spin-btn {
    padding: 16px 44px;
    background: linear-gradient(135deg, #a855f7, #7c3aed);
    color: #fff; border: none; border-radius: 12px;
    font-size: 17px; font-weight: 900; letter-spacing: 2px;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 8px 24px rgba(168, 85, 247, 0.5);
    transition: all 0.15s;
  }
  .market-spin-btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.15); }
  .market-balance {
    margin-top: 18px; font-size: 12px; color: #94a3b8;
  }
  .market-balance b { color: #c084fc; }

  /* Иконка купона */
  .coupon-icon {
    height: 20px;
    width: auto;              /* ← авто — пропорции сохранятся */
    object-fit: contain;
    image-rendering: pixelated;
    vertical-align: -4px;
    display: inline-block;
  }

  /* ═══ РУЛЕТКА ═══ */
  .roulette-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.9);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; padding: 20px;
    animation: fadeIn 0.2s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .roulette-modal {
    background: linear-gradient(135deg, #1e293b, #0f172a);
    border-radius: 20px;
    padding: 28px 20px;
    max-width: 520px; width: 100%;
    border: 3px solid #a855f7;
    box-shadow: 0 0 80px rgba(168,85,247,0.5);
    text-align: center;
  }
  .roulette-title {
    font-size: 16px; font-weight: 900;
    letter-spacing: 3px; color: #c084fc;
    margin-bottom: 20px;
  }
  .roulette-window {
    position: relative;
    width: 100%; height: 120px;
    background: rgba(0,0,0,0.4);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .roulette-pointer {
    position: absolute;
    top: 0; bottom: 0;
    left: 50%; transform: translateX(-50%);
    width: 4px;
    background: linear-gradient(to bottom, #ffd700, #ff9500);
    z-index: 10;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.9);
  }
  .roulette-pointer::before,
  .roulette-pointer::after {
    content: '';
    position: absolute;
    left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
  }
  .roulette-pointer::before {
    top: -2px;
    border-top: 12px solid #ffd700;
  }
  .roulette-pointer::after {
    bottom: -2px;
    border-bottom: 12px solid #ffd700;
  }
  .roulette-strip {
    display: flex;
    height: 100%;
    will-change: transform;
  }
  .roulette-item {
    flex: 0 0 100px;
    width: 100px; height: 100%;
    display: flex; align-items: center; justify-content: center;
    border-right: 1px solid rgba(255,255,255,0.05);
    padding: 8px;
    box-sizing: border-box;
  }
  .roulette-item img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
  }
  .roulette-item .r-emoji { font-size: 44px; }
  .roulette-item.rarity-common    { background: rgba(148,163,184,0.06); }
  .roulette-item.rarity-rare      { background: rgba(59,130,246,0.10); }
  .roulette-item.rarity-epic      { background: rgba(168,85,247,0.12); }
  .roulette-item.rarity-legendary { background: rgba(245,158,11,0.12); }
  .roulette-item.rarity-mythical  { background: rgba(239,68,68,0.12); }

  .roulette-result {
    font-size: 15px; color: #cbd5e1;
    min-height: 24px;
    opacity: 0; transition: opacity 0.3s;
    line-height: 1.4;
  }
  
</style>
</head>
<body>

<div class="shell">
  <div class="header">
    <div class="header-title">⚔️ ОСАДА</div>
  </div>

  <div class="content" id="content"></div>

  <button class="play-btn" id="playBtn">ИГРАТЬ</button>

  <div class="tabs">
    <button class="tab exit-tab" data-tab="boxes"><span class="tab-icon">📦</span><span>ВОКС</span></button>
    <button class="tab" data-tab="deck"><span class="tab-icon">🃏</span><span>КОЛОДА</span></button>
    <button class="tab battle-tab" data-tab="battle"><span class="tab-icon">⚔️</span><span>В БОЙ</span></button>
    <button class="tab" data-tab="market"><span class="tab-icon">🏪</span><span>РЫНОК</span></button>
  </div>
</div>

<!-- ═══ CARD MODAL ═══ -->
<div class="overlay" id="cardOverlay">
  <div class="card-modal" id="cardModal">
    <button class="card-modal-x" id="cardModalX">×</button>
    <div class="card-modal-rarity" id="cardRarity">ОБЫЧНЫЙ</div>
    <div class="card-modal-sprite" id="cardSprite"></div>
    <div class="card-modal-name" id="cardName">—</div>
    <div class="card-modal-desc" id="cardDesc">—</div>
    <button class="card-modal-btn" id="cardBtn">ВЫБРАТЬ</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
//  КАРТЫ ОСАДЫ
//  unlocked: true — разблокирована; false — закрыта
//  На старте доступны Шип и Ромб
// ═══════════════════════════════════════════════
const SIEGE_CARDS = [
  { id: 'spike',    emoji: '🟩', name: 'Шип',      rarity: 'common',    rarityName: 'Обычный',
    desc: 'Бьёт по линиям вверх/вниз/влево/вправо. Попадает по всем мобам на линии до края поля.' },
  { id: 'rhombus',  emoji: '🔷', name: 'Ромб',     rarity: 'common',    rarityName: 'Обычный',
    desc: 'Снайпер. Стреляет в самого дальнего моба. Чем дальше цель — тем сильнее удар.' },
  { id: 'rhythm',   emoji: '🟨', name: 'Ритм',     rarity: 'rare',      rarityName: 'Редкий',
    desc: 'Не атакует. Соседние юниты получают +15% к скорости атаки.' },
  { id: 'iceberg',  emoji: '🧊', name: 'Айсберг',  rarity: 'rare',      rarityName: 'Редкий',
    desc: 'Атака по одной цели с замедлением. Каждый 5-й удар замораживает на 1.5 сек.' },
  { id: 'boom',     emoji: '💥', name: 'Бум',      rarity: 'epic',      rarityName: 'Эпический',
    desc: 'Катапульта. Большой урон по скоплению мобов, долгая перезарядка.' },
  { id: 'tesla',    emoji: '🟪', name: 'Дуга',     rarity: 'epic',      rarityName: 'Эпический',
    desc: 'Молния прыгает между мобами, урон падает на 20% за каждый прыжок.' },
  { id: 'assassin', emoji: '🗡️', name: 'Ассасин',  rarity: 'legendary', rarityName: 'Легендарный',
    desc: 'Быстрые атаки, высокий урон по одной цели.' },
  { id: 'butcher',  emoji: '🟥', name: 'Мясник',   rarity: 'legendary', rarityName: 'Легендарный',
    desc: 'Рубит всех мобов рядом. За каждое убийство получает +1 урона до конца волны.' },
];

// ─── Прогресс Осады (localStorage) ───
const SIEGE_PROGRESS_KEY = 'siege_progress_v1';

let siegeProgress = {
  unlocked: ['spike', 'rhombus'],   // стартовые карты
  shards: 0,                        // осколки Осады
};

try {
  const saved = JSON.parse(localStorage.getItem(SIEGE_PROGRESS_KEY) || 'null');
  if (saved && typeof saved === 'object') {
    if (Array.isArray(saved.unlocked)) siegeProgress.unlocked = saved.unlocked;
    if (typeof saved.shards === 'number') siegeProgress.shards = saved.shards;
  }
} catch (e) {}

// Страховка: стартовые карты всегда разблокированы
if (!siegeProgress.unlocked.includes('spike'))  siegeProgress.unlocked.push('spike');
if (!siegeProgress.unlocked.includes('rhombus')) siegeProgress.unlocked.push('rhombus');

function saveSiegeProgress() {
  localStorage.setItem(SIEGE_PROGRESS_KEY, JSON.stringify(siegeProgress));
}

function isCardUnlocked(id) {
  return siegeProgress.unlocked.includes(id);
}

const DECK_SIZE = 8;

// ─── Состояние колоды (localStorage) ───
let siegeDeck = [];
try {
  siegeDeck = JSON.parse(localStorage.getItem('siege_deck_v1') || '[]');
  if (!Array.isArray(siegeDeck)) siegeDeck = [];
} catch (e) { siegeDeck = []; }
while (siegeDeck.length < DECK_SIZE) siegeDeck.push(null);
siegeDeck = siegeDeck.slice(0, DECK_SIZE);

function saveDeck() {
  localStorage.setItem('siege_deck_v1', JSON.stringify(siegeDeck));
}

function cardById(id) { return SIEGE_CARDS.find(c => c.id === id); }

// ═══════════════════════════════════════════════
//  ОТРИСОВКА
// ═══════════════════════════════════════════════
function renderDeckTab() {
  const c = document.getElementById('content');
  c.classList.remove('center-content');
  c.innerHTML = `
    <div class="deck-section-title">Твоя колода</div>
    <div class="deck-grid" id="deckGrid"></div>
    <div class="deck-section-title">Все карты</div>
    <div class="char-grid" id="charGrid"></div>
  `;
  renderDeckSlots();
  renderCharGrid();
}

// ═══════════════════════════════════════════════
//  РЫНОК — премиум-бокс
// ═══════════════════════════════════════════════
const PREMIUM_COST = 10;   // осколков Осады за прокрут

function renderMarketTab() {
  const c = document.getElementById('content');
  c.classList.remove('center-content');
  c.innerHTML = `
    <div class="market-card">
      <div class="market-icon">🎰</div>
      <div class="market-title">Премиум-бокс</div>
      <div class="market-desc">
        Крути рулетку — получай персонажей для колоды.<br>
        Все карты выпадают с равным шансом.
      </div>

      <div class="market-cost">
        <div class="market-cost-label">СТОИМОСТЬ</div>
        <div class="market-cost-value">${PREMIUM_COST} <img src="units/ticket.png" class="coupon-icon" alt="🎟️"></div>
      </div>

      <button class="market-spin-btn" id="premiumSpinBtn">КРУТИТЬ</button>

      <div class="market-balance">
        У тебя: <b id="premiumBalance">${siegeProgress.shards}</b> <img src="units/ticket.png" class="coupon-icon" alt="🎟️">
      </div>
    </div>
  `;

  updatePremiumButton();
  document.getElementById('premiumSpinBtn').addEventListener('click', spinPremium);
}

function updatePremiumButton() {
  const btn = document.getElementById('premiumSpinBtn');
  const bal = document.getElementById('premiumBalance');
  if (!btn || !bal) return;
  bal.textContent = siegeProgress.shards;
  const canAfford = siegeProgress.shards >= PREMIUM_COST;
  btn.disabled = !canAfford;
  btn.style.opacity = canAfford ? '1' : '0.4';
  btn.style.cursor = canAfford ? 'pointer' : 'not-allowed';
}

async function spinPremium() {
  if (siegeProgress.shards < PREMIUM_COST) return;

  // Списываем
  siegeProgress.shards -= PREMIUM_COST;
  saveSiegeProgress();
  updatePremiumButton();

  // Выбираем карту
  const card = SIEGE_CARDS[Math.floor(Math.random() * SIEGE_CARDS.length)];
  const wasLocked = !isCardUnlocked(card.id);

  // Показываем рулетку
  showRoulette(card, wasLocked, () => {
    if (wasLocked) {
      siegeProgress.unlocked.push(card.id);
      saveSiegeProgress();
    } else {
      // Дубликат — компенсация
      siegeProgress.shards += 5;
      saveSiegeProgress();
    }
    renderCharGrid();      // обновить сетку карт
    renderMarketTab();     // обновить баланс
  });
}

function showRoulette(winCard, wasLocked, onDone) {
  // Модалка поверх всего
  const overlay = document.createElement('div');
  overlay.className = 'roulette-overlay';
  overlay.innerHTML = `
    <div class="roulette-modal">
      <div class="roulette-title">🎰 КРУТИМ...</div>
      <div class="roulette-window">
        <div class="roulette-pointer"></div>
        <div class="roulette-strip" id="rouletteStrip"></div>
      </div>
      <div class="roulette-result" id="rouletteResult"></div>
    </div>
  `;
  document.body.appendChild(overlay);

  const strip = overlay.querySelector('#rouletteStrip');
  const ITEM_W = 100;
  const TOTAL = 40;
  const WIN_INDEX = 33;   // сюда встанет победитель

  // Заполняем ленту
  for (let i = 0; i < TOTAL; i++) {
    const c = i === WIN_INDEX
      ? winCard
      : SIEGE_CARDS[Math.floor(Math.random() * SIEGE_CARDS.length)];
    const el = document.createElement('div');
    el.className = 'roulette-item rarity-' + c.rarity;
    el.innerHTML = `<img src="units/${c.id}.png" alt="${c.name}"
      onerror="this.outerHTML='<span class=\\'r-emoji\\'>${c.emoji}</span>'">`;
    strip.appendChild(el);
  }

  // Сдвиг: центрируем WIN_INDEX в окне
  const windowEl = overlay.querySelector('.roulette-window');
  const winW = windowEl.clientWidth;
  const targetX = -(WIN_INDEX * ITEM_W + ITEM_W / 2 - winW / 2);
  const jitter = (Math.random() - 0.5) * 40;   // лёгкий сдвиг, чтобы не всегда центр

  requestAnimationFrame(() => {
    strip.style.transition = 'transform 4s cubic-bezier(0.15, 0.7, 0.2, 1)';
    strip.style.transform  = `translateX(${targetX + jitter}px)`;
  });

  setTimeout(() => {
    overlay.querySelector('.roulette-title').textContent = wasLocked ? '🎉 НОВАЯ КАРТА!' : '🃏 Дубликат';
    const resultEl = overlay.querySelector('#rouletteResult');
    resultEl.innerHTML = wasLocked
      ? `<b style="color:#4ade80;">${winCard.name}</b> разблокирован!`
      : `<b style="color:#fbbf24;">${winCard.name}</b> уже был — +5 <img src="units/ticket.png" class="coupon-icon" style="vertical-align:-3px;"> компенсация`;
    resultEl.style.opacity = '1';

    // Клик закрывает и вызывает колбэк
    overlay.addEventListener('click', () => {
      overlay.remove();
      onDone();
    }, { once: true });

    // Или авто-закрытие через 3 секунды
    setTimeout(() => {
      if (overlay.parentNode) {
        overlay.remove();
        onDone();
      }
    }, 3000);
  }, 4200);
}

function renderDeckSlots() {
  const grid = document.getElementById('deckGrid');
  grid.innerHTML = siegeDeck.map((id, i) => {
    if (id) {
      const card = cardById(id);
      return `
        <div class="deck-slot filled" data-slot="${i}" data-id="${id}">
          <img src="units/${id}.png" alt="${card.name}"
               onerror="this.outerHTML='<span class=\\'slot-emoji\\'>${card.emoji}</span>'">
        </div>`;
    }
    return `<div class="deck-slot" data-slot="${i}"><span class="slot-empty">+</span></div>`;
  }).join('');

  grid.querySelectorAll('.deck-slot').forEach(slot => {
    slot.addEventListener('click', () => {
      const id = slot.dataset.id;
      if (id) openCardModal(id, true); // открываем с кнопкой "Убрать"
    });
  });
}

function renderCharGrid() {
  const grid = document.getElementById('charGrid');
  grid.innerHTML = SIEGE_CARDS.map(card => {
    const inDeck = siegeDeck.includes(card.id);
    const locked = !isCardUnlocked(card.id);      // ← из прогресса
    const cls = 'char-cell' + (inDeck ? ' in-deck' : '') + (locked ? ' locked' : '');
    const badge = inDeck ? `<div class="in-deck-badge">В КОЛОДЕ</div>` : '';
    const lock = locked ? `<div class="lock-overlay">🔒</div>` : '';
    return `
      <div class="${cls}" data-id="${card.id}">
        ${badge}${lock}
        <img src="units/${card.id}.png" alt="${card.name}"
             onerror="this.outerHTML='<span class=\\'char-emoji\\'>${card.emoji}</span>'">
      </div>`;
  }).join('');

  grid.querySelectorAll('.char-cell').forEach(cell => {
    cell.addEventListener('click', () => {
      const c = SIEGE_CARDS.find(x => x.id === cell.dataset.id);
      if (!c) return;
      if (!isCardUnlocked(c.id)) { openCardModal(c.id, false, true); return; }
      openCardModal(c.id, false);
    });
  });
}

// ═══════════════════════════════════════════════
//  МОДАЛКА КАРТЫ
// ═══════════════════════════════════════════════
let modalCardId = null;
let modalFromDeck = false;
let modalLocked = false;

function openCardModal(cardId, fromDeck, locked = false) {
  const card = cardById(cardId);
  if (!card) return;

  modalCardId = cardId;
  modalFromDeck = fromDeck;
  modalLocked = locked || !isCardUnlocked(card.id);

  const modal = document.getElementById('cardModal');
  modal.className = 'card-modal ' + card.rarity;

  document.getElementById('cardRarity').textContent = card.rarityName.toUpperCase();
  document.getElementById('cardName').textContent = card.name;
  document.getElementById('cardDesc').textContent = card.desc;

  const spriteEl = document.getElementById('cardSprite');
  const img = new Image();
  img.onload = () => { spriteEl.innerHTML = `<img src="${img.src}" alt="${card.name}">`; };
  img.onerror = () => { spriteEl.innerHTML = `<span class="emoji-fallback">${card.emoji}</span>`; };
  img.src = `units/${cardId}.png`;

  updateCardModalButton();
  document.getElementById('cardOverlay').classList.add('active');
}

function updateCardModalButton() {
  const btn = document.getElementById('cardBtn');
  const card = cardById(modalCardId);
  if (!card) return;

  const inDeck = siegeDeck.includes(card.id);
  const deckFull = siegeDeck.every(s => s !== null);

  btn.classList.remove('remove');
  btn.disabled = false;

  if (modalLocked) {
    btn.textContent = '🔒 ЗАБЛОКИРОВАНО';
    btn.disabled = true;
  } else if (inDeck) {
    btn.textContent = 'УБРАТЬ ИЗ КОЛОДЫ';
    btn.classList.add('remove');
  } else if (deckFull) {
    btn.textContent = 'КОЛОДА ЗАПОЛНЕНА';
    btn.disabled = true;
  } else {
    btn.textContent = 'ВЫБРАТЬ';
  }
}

function closeCardModal() {
  document.getElementById('cardOverlay').classList.remove('active');
  modalCardId = null;
}

document.getElementById('cardModalX').addEventListener('click', closeCardModal);
document.getElementById('cardOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'cardOverlay') closeCardModal();
});

document.getElementById('cardBtn').addEventListener('click', () => {
  const card = cardById(modalCardId);
  if (!card || modalLocked) return;

  const idx = siegeDeck.indexOf(card.id);

  if (idx !== -1) {
    // Убираем из колоды
    siegeDeck[idx] = null;
  } else {
    // Добавляем в первый свободный слот
    const emptyIdx = siegeDeck.indexOf(null);
    if (emptyIdx === -1) return;
    siegeDeck[emptyIdx] = card.id;
  }

  saveDeck();
  closeCardModal();
  renderDeckSlots();
  renderCharGrid();
  renderTab(activeTab);   // ← обновить кнопку ИГРАТЬ
});

// ═══════════════════════════════════════════════
//  ТАБЫ
// ═══════════════════════════════════════════════
const TAB_CONTENT = {
  battle: {
    icon: '⚔️',
    title: 'Готов к бою?',
    desc: 'Колода из 8 карт, бесконечные волны. Продержись как можно дольше.',
  },
  deck:   { render: renderDeckTab },
  market: { render: renderMarketTab },
};

const params = new URLSearchParams(location.search);
let activeTab = params.get('tab') || 'battle';
if (!TAB_CONTENT[activeTab]) activeTab = 'battle';

function renderTab(id) {
  const t = TAB_CONTENT[id];
  if (!t) return;
  const c = document.getElementById('content');

  if (t.render) {
    t.render();
  } else {
    c.classList.add('center-content');
    c.innerHTML = `<div class="content-placeholder">
      <span class="icon">${t.icon}</span>
      <b>${t.title}</b>${t.desc}
    </div>`;
  }

  document.querySelectorAll('.tab').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === id);
  });

  const playBtn = document.getElementById('playBtn');
  const filled = siegeDeck.filter(x => x !== null).length;

  // Текст/состояние кнопки обновляем всегда
  playBtn.disabled = filled === 0;
  playBtn.textContent = filled === 0
    ? 'СНАЧАЛА СОБЕРИ КОЛОДУ'
    : (filled < DECK_SIZE ? `ИГРАТЬ (${filled}/${DECK_SIZE})` : 'ИГРАТЬ');
  playBtn.style.opacity = filled === 0 ? '0.4' : '1';
  playBtn.style.cursor = filled === 0 ? 'not-allowed' : 'pointer';

  // Показываем кнопку только на табе "В БОЙ"
  playBtn.style.display = (id === 'battle') ? 'block' : 'none';
}

document.querySelectorAll('.tab').forEach(el => {
  el.addEventListener('click', () => {
    const id = el.dataset.tab;
    if (id === 'boxes') { window.location.href = 'index.html'; return; }
    activeTab = id;
    renderTab(id);
    history.replaceState(null, '', id === 'battle' ? '' : '?tab=' + id);
  });
});

document.getElementById('playBtn').addEventListener('click', () => {
  window.location.href = 'siege-match.html';
});

renderTab(activeTab);
</script>
